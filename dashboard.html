<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AI OmniPost — A/B/C results</title>
    <style>
      :root {
        --paper: #f6f4ef; --ink: #0b0f13; --muted: #5a6470;
        --line: #d9d4c8; --blue: #2f6df0; --pos: #2f7d4e; --surface: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--paper); color: var(--ink);
        font-family: system-ui, -apple-system, sans-serif; line-height: 1.5;
      }
      .wrap { max-width: 860px; margin: 0 auto; padding: 56px 24px; }
      h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }
      .sub { color: var(--muted); font-size: 14px; margin: 0 0 32px; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 14px; padding: 24px;
      }
      .gate { display: flex; gap: 10px; margin-bottom: 24px; }
      input[type=password] {
        flex: 1; height: 44px; padding: 0 14px; border-radius: 10px;
        border: 1px solid var(--line); font-size: 14px; font-family: inherit;
      }
      button {
        height: 44px; padding: 0 20px; border-radius: 10px; border: none;
        background: var(--ink); color: var(--paper); font-size: 14px;
        font-weight: 500; cursor: pointer; font-family: inherit;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th, td {
        text-align: right; padding: 14px 12px; font-size: 14px;
        border-bottom: 1px solid var(--line);
      }
      th:first-child, td:first-child { text-align: left; }
      th {
        font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--muted); font-weight: 500;
      }
      .variant { font-weight: 600; }
      .rate { font-size: 16px; font-weight: 600; }
      .lead { color: var(--pos); }
      .note { font-size: 13px; color: var(--muted); margin-top: 18px; }
      .err { color: #b3261e; font-size: 14px; margin-top: 14px; }
      .theme { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>A/B/C landing test</h1>
      <p class="sub">Conversion rate by theme. Self-hosted counter — no third-party analytics.</p>

      <div class="card">
        <div class="gate">
          <input id="token" type="password" placeholder="Dashboard token"
                 autocomplete="off" />
          <button id="load">View results</button>
        </div>
        <div id="out"></div>
        <div id="msg" class="err"></div>
      </div>

      <p class="note">
        Rates are directional until each arm has ~100+ conversions. The
        leading arm is highlighted but is <strong>not</strong> a winner until
        the gap holds with enough volume. Resist calling it in week one.
      </p>
    </div>

    <script src="src/ab-config.js"></script>
    <script>
      (function () {
        var THEMES = {
          A: "Editorial Light",
          B: "Studio Dark",
          C: "Bazaar",
        };
        var tokenEl = document.getElementById("token");
        var btn = document.getElementById("load");
        var out = document.getElementById("out");
        var msg = document.getElementById("msg");

        // Restore a token from this tab's session only (never persisted
        // to localStorage, never put in the URL).
        try {
          var saved = sessionStorage.getItem("ab_dash_token");
          if (saved) tokenEl.value = saved;
        } catch (e) {}

        function pct(c, i) {
          return i > 0 ? (c / i) * 100 : 0;
        }

        function render(counts) {
          out.textContent = "";
          var rates = counts.map(function (r) {
            return pct(r.conversions || 0, r.impressions || 0);
          });
          var best = Math.max.apply(null, rates);

          var table = document.createElement("table");
          var thead = document.createElement("thead");
          thead.innerHTML =
            "<tr><th>Variant</th><th>Views</th><th>Signups</th>" +
            "<th>Conv. rate</th></tr>";
          table.appendChild(thead);

          var tbody = document.createElement("tbody");
          counts.forEach(function (r, idx) {
            var tr = document.createElement("tr");
            var rate = rates[idx];
            var leads = rate === best && r.conversions > 0;

            var cells = [
              { html: '<span class="variant">' + r.variant +
                  '</span> <span class="theme">' +
                  (THEMES[r.variant] || "") + "</span>" },
              { text: String(r.impressions || 0), mono: true },
              { text: String(r.conversions || 0), mono: true },
              { text: rate.toFixed(2) + "%", cls: "rate" + (leads ? " lead" : "") },
            ];
            cells.forEach(function (c) {
              var td = document.createElement("td");
              if (c.html != null) td.innerHTML = c.html; // controlled, no user input
              else td.textContent = c.text;
              if (c.mono) td.className = "mono";
              if (c.cls) td.className = c.cls;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          out.appendChild(table);
        }

        function load() {
          msg.textContent = "";
          var cfg = window.AB_CONFIG || {};
          if (!cfg.statsUrl || cfg.statsUrl.indexOf("<PROJECT_REF>") !== -1) {
            msg.textContent = "Set the function URLs in src/ab-config.js first.";
            return;
          }
          var token = tokenEl.value.trim();
          if (!token) { msg.textContent = "Enter the dashboard token."; return; }

          btn.disabled = true;
          btn.textContent = "Loading…";
          fetch(cfg.statsUrl, {
            headers: { Authorization: "Bearer " + token },
          })
            .then(function (r) {
              if (r.status === 401) throw new Error("Wrong token.");
              if (!r.ok) throw new Error("Server error (" + r.status + ").");
              return r.json();
            })
            .then(function (data) {
              try { sessionStorage.setItem("ab_dash_token", token); } catch (e) {}
              render(data.counts || []);
            })
            .catch(function (err) {
              out.textContent = "";
              msg.textContent = err.message || "Failed to load.";
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "View results";
            });
        }

        btn.addEventListener("click", load);
        tokenEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter") load();
        });
      })();
    </script>
  </body>
</html>
