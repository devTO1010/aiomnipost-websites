<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI OmniPost — Where your social media lives.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;700&family=Caprasimo&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <style>
      :root {
        --paper: #fff5db;
        --paper-2: #ffe8a8;
        --ink: #1a0f2e;
        --ink-2: #3b2462;
        --muted: #594774;
        --muted-2: #8c7aa8;
        --line: #1a0f2e;
        --line-2: #1a0f2e;
        --navy: #ff3d6e;
        --navy-2: #ff5b85;
        --blue: #ff3d6e;
        --blue-soft: #ffd0de;
        --warn: #ff8a3d;
        --pos: #2dbf6e;
        --surface: #ffffff;
        --on-accent: #1a0f2e;

        /* candy palette — section backgrounds */
        --c-butter: #ffea7a;
        --c-coral:  #ffc1aa;
        --c-lilac:  #ddd2ff;
        --c-mint:   #b8ecc8;
        --c-peach:  #ffd6a8;
        --c-pink:   #ff6f9c;
        --c-blueberry: #88b3ff;
        --c-lime: #d9ee5b;

        --on-dark: #ffffff;
        --on-dark-mute: rgba(255,255,255,0.85);
        --on-dark-mute-2: rgba(255,255,255,0.65);
        --on-dark-line: rgba(255,255,255,0.22);
        --on-dark-line-2: rgba(255,255,255,0.4);
        --on-dark-surface: rgba(255,255,255,0.1);
        --on-dark-accent: var(--c-lime);
        --mute-on-ink: rgba(255,255,255,0.75);
        --mute-on-ink-2: rgba(255,255,255,0.6);
        --accent-on-ink: var(--c-lime);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Geist", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
        line-height: 1.5;
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .mono { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 700; }
      .serif { font-family: "Caprasimo", serif; font-style: normal; font-weight: 400; letter-spacing: -0.01em; }
      a { color: inherit; }
      .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
      @media (max-width: 720px) { .container { padding: 0 20px; } }
      .eyebrow {
        font-family: "Geist Mono", monospace;
        font-size: 11.5px; font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ink);
        background: var(--c-lime);
        padding: 5px 12px;
        display: inline-flex;
        align-items: center;
        border: 2px solid var(--ink);
        border-radius: 999px;
      }
      .section-num {
        font-family: "Caprasimo", serif;
        font-size: 22px;
        color: var(--ink);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 50px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        border: 2.5px solid var(--ink);
        cursor: pointer;
        text-decoration: none;
        box-shadow: 4px 4px 0 0 var(--ink);
        transition: transform 100ms ease, box-shadow 100ms ease, background 120ms ease;
      }
      .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 0 var(--ink); }
      .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 var(--ink); }
      .btn-primary { background: var(--ink); color: var(--paper); }
      .btn-primary:hover { background: var(--ink-2); }
      .btn-ghost { background: #fff; color: var(--ink); }
      .btn-ghost:hover { background: var(--c-butter); }
      .btn-light { background: var(--c-butter); color: var(--ink); }
      .btn-light:hover { background: #fff; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 14px;
        border-radius: 999px;
        border: 2.5px solid var(--ink);
        font-family: "Geist Mono", monospace;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
        background: #fff;
        box-shadow: 3px 3px 0 0 var(--ink);
      }
      .pill:nth-child(2) { background: var(--c-mint); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-pink); display: inline-block; border: 1.5px solid var(--ink); }
      .card {
        background: #fff;
        border: 2.5px solid var(--ink);
        border-radius: 18px;
        box-shadow: 6px 6px 0 0 var(--ink);
      }
      .divider { height: 2.5px; background: var(--ink); width: 100%; }
      h1, h2, h3, h4 {
        font-family: "Caprasimo", serif;
        font-weight: 400;
        letter-spacing: -0.025em;
        margin: 0;
        line-height: 1;
      }
      h1 { font-size: clamp(44px, 6.5vw, 88px); line-height: 0.95; }
      h2 { font-size: clamp(34px, 4.2vw, 56px); line-height: 0.98; }
      h3 { font-size: 24px; line-height: 1.1; letter-spacing: -0.015em; }
      p { margin: 0; }
      .grid { display: grid; }
      .row { display: flex; }
      .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-5 { gap: 20px; } .gap-6 { gap: 24px; } .gap-8 { gap: 32px; } .gap-10 { gap: 40px; } .gap-12 { gap: 48px; }

      .dark {
        background: var(--c-pink);
        color: #fff;
      }
      .dark .eyebrow { background: #fff; color: var(--ink); border-color: var(--ink); }
      .dark .section-num { color: #fff; }
      .dark .pill { color: var(--ink); border-color: var(--ink); background: var(--c-butter); }
      .dark .btn-ghost { color: var(--ink); background: #fff; }
      .dark .btn-ghost:hover { background: var(--c-butter); }
      .dark .btn-light { background: var(--ink); color: var(--paper); }
      .dark .btn-light:hover { background: var(--ink-2); }
      .dark .serif { color: var(--c-lime); }

      /* candy section backgrounds */
      #top { background: var(--c-butter); border-bottom: 2.5px solid var(--ink); }
      #composer { background: var(--c-coral); border-bottom: 2.5px solid var(--ink); }
      #features { background: var(--c-lilac); border-bottom: 2.5px solid var(--ink); }
      #pricing { background: var(--c-mint); border-bottom: 2.5px solid var(--ink); }
      #faq { background: var(--c-peach); border-bottom: 2.5px solid var(--ink); }

      .hero-bg {
        position: absolute; inset: 0; pointer-events: none;
        background-image:
          radial-gradient(circle at 8% 18%, var(--c-pink) 0, var(--c-pink) 32px, transparent 34px),
          radial-gradient(circle at 92% 72%, var(--c-blueberry) 0, var(--c-blueberry) 42px, transparent 44px),
          radial-gradient(circle at 82% 14%, var(--c-mint) 0, var(--c-mint) 26px, transparent 28px),
          radial-gradient(circle at 16% 86%, var(--c-lilac) 0, var(--c-lilac) 36px, transparent 38px);
      }

      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.4); }
      }
      .live-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
      @keyframes scroll-x {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }
      .marquee { display: flex; gap: 56px; animation: scroll-x 32s linear infinite; width: max-content; }

      input[type="text"], textarea, select {
        font-family: inherit;
        font-size: 14.5px; font-weight: 500;
        color: var(--ink);
        background: #fff !important;
        border: 2.5px solid var(--ink) !important;
        border-radius: 12px !important;
      }
      input[type="text"]:focus, textarea:focus, select:focus { outline: none; box-shadow: 3px 3px 0 0 var(--ink); }
      textarea { resize: none; }
      ::selection { background: var(--c-pink); color: #fff; }

      .tilt-l { transform: rotate(-3deg); }
      .tilt-r { transform: rotate(3deg); }

      details > summary { list-style: none; cursor: pointer; }
      details > summary::-webkit-details-marker { display: none; }

      @media (max-width: 920px) {
        .site-nav { display: none; }
      }

      .composer-card { background: #fff !important; border: 2.5px solid var(--ink) !important; border-radius: 20px !important; box-shadow: 6px 6px 0 0 var(--ink); }
      .platform-toggle { background: #fff !important; border: 2px solid var(--ink) !important; border-radius: 12px !important; color: var(--ink) !important; font-weight: 600 !important; }
      .platform-toggle.on { background: var(--c-pink) !important; color: #fff !important; border-color: var(--ink) !important; }
      .tone-chip { background: #fff !important; border: 2px solid var(--ink) !important; border-radius: 999px !important; color: var(--ink) !important; font-weight: 600 !important; }
      .tone-chip.on { background: var(--ink) !important; color: var(--paper) !important; border-color: var(--ink) !important; }

      header { background: rgba(255,234,122,0.9) !important; border-bottom: 2.5px solid var(--ink) !important; backdrop-filter: blur(8px); }
      header nav a { font-weight: 600; }
      header nav a:hover { color: var(--c-pink); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="src/ab-config.js"></script>
    <script src="src/ab.js"></script>

    <script type="text/babel" src="src/icons.jsx"></script>
    <script type="text/babel" src="src/platforms.jsx"></script>
    <script type="text/babel" src="src/composer.jsx"></script>
    <script type="text/babel" src="src/sections.jsx"></script>
    <script type="text/babel" src="src/app.jsx"></script>
  </body>
</html>
