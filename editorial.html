<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI OmniPost — One brief. Every platform. On-brand.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <style>
      :root {
        --paper: #f6f4ef;
        --paper-2: #efece4;
        --ink: #0b0f13;
        --ink-2: #1d2630;
        --muted: #5a6470;
        --muted-2: #8b94a0;
        --line: #d9d4c8;
        --line-2: #e8e4da;
        --navy: #0c1c2e;
        --navy-2: #16304d;
        --blue: #2f6df0;
        --blue-soft: #dfe9ff;
        --warn: #c46a2b;
        --pos: #2f7d4e;
        --surface: #ffffff;
        --on-accent: #ffffff;
        --on-dark: #ffffff;
        --on-dark-mute: rgba(255,255,255,0.7);
        --on-dark-mute-2: rgba(255,255,255,0.55);
        --on-dark-line: rgba(255,255,255,0.12);
        --on-dark-line-2: rgba(255,255,255,0.2);
        --on-dark-surface: rgba(255,255,255,0.04);
        --on-dark-accent: #9bd0ff;
        --mute-on-ink: rgba(255,255,255,0.65);
        --mute-on-ink-2: rgba(255,255,255,0.55);
        --accent-on-ink: #9bd0ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Geist", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .mono { font-family: "Geist Mono", ui-monospace, monospace; font-feature-settings: "ss01"; }
      .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }
      a { color: inherit; }
      .container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
      @media (max-width: 720px) {
        .container { padding: 0 20px; }
      }
      .eyebrow {
        font-family: "Geist Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      .section-num {
        font-family: "Geist Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 500;
        font-family: inherit;
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        transition: transform 120ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease;
      }
      .btn:active { transform: translateY(1px); }
      .btn-primary { background: var(--ink); color: var(--paper); }
      .btn-primary:hover { background: var(--navy); }
      .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
      .btn-ghost:hover { border-color: var(--ink); }
      .btn-light { background: var(--paper); color: var(--ink); }
      .btn-light:hover { background: #fff; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-family: "Geist Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        background: rgba(255,255,255,0.5);
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); display: inline-block; }
      .card {
        background: #fff;
        border: 1px solid var(--line-2);
        border-radius: 14px;
      }
      .divider {
        height: 1px;
        background: var(--line);
        width: 100%;
      }
      h1, h2, h3, h4 { letter-spacing: -0.02em; font-weight: 500; margin: 0; }
      h1 { font-size: clamp(44px, 7vw, 88px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 500; }
      h2 { font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.028em; }
      h3 { font-size: 22px; line-height: 1.2; }
      p { margin: 0; }
      /* utility tweaks */
      .grid { display: grid; }
      .row { display: flex; }
      .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-5 { gap: 20px; } .gap-6 { gap: 24px; } .gap-8 { gap: 32px; } .gap-10 { gap: 40px; } .gap-12 { gap: 48px; }

      /* dark section */
      .dark {
        background: var(--navy);
        color: #e8ebee;
      }
      .dark .eyebrow, .dark .section-num { color: rgba(255,255,255,0.55); }
      .dark .pill { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); }
      .dark .btn-ghost { color: #fff; border-color: rgba(255,255,255,0.25); }
      .dark .btn-ghost:hover { border-color: #fff; }

      /* hairline grid background for hero */
      .hero-bg {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(11,15,19,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(11,15,19,0.05) 1px, transparent 1px);
        background-size: 96px 96px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 30%, transparent 80%);
        pointer-events: none;
      }
      /* shimmer for live tag */
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.6; }
      }
      .live-dot { animation: pulse-dot 1.8s ease-in-out infinite; }

      /* marquee */
      @keyframes scroll-x {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }
      .marquee { display: flex; gap: 56px; animation: scroll-x 32s linear infinite; width: max-content; }

      input[type="text"], textarea, select {
        font-family: inherit;
        font-size: 14px;
        color: var(--ink);
      }
      textarea { resize: none; }
      ::selection { background: var(--ink); color: var(--paper); }

      /* phone tilt */
      .tilt-l { transform: rotate(-3deg); }
      .tilt-r { transform: rotate(3deg); }

      details > summary { list-style: none; cursor: pointer; }
      details > summary::-webkit-details-marker { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="src/ab-config.js"></script>
    <script src="src/ab.js"></script>

    <script type="text/babel" src="src/icons.jsx"></script>
    <script type="text/babel" src="src/platforms.jsx"></script>
    <script type="text/babel" src="src/composer.jsx"></script>
    <script type="text/babel" src="src/sections.jsx"></script>
    <script type="text/babel" src="src/app.jsx"></script>
  </body>
</html>
