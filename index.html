<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI OmniPost</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0b0c; color: #fff;
        font-family: system-ui, -apple-system, sans-serif; }
      .splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px; text-align: center;
      }
      .logo { width: 36px; height: 36px; border-radius: 8px; background: #fff; position: relative; }
      .logo::after { content: ""; position: absolute; inset: 8px; border-radius: 50%;
        border: 2px solid #0a0b0c; }
      .label { font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; text-transform: uppercase; }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.15); border-top-color: #fff;
        animation: spin 0.9s linear infinite; margin-top: 8px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo"></div>
      <div class="label">AI OmniPost</div>
      <div class="spinner"></div>
    </div>

    <script>
      // ── A/B/C splitter ──────────────────────────────────────────────
      // First-visit: pick a variant uniformly at random and remember.
      // Return-visit: send the visitor to the same variant they saw last
      // time. Carry ?variant=X through to signup CTAs so conversions can
      // be attributed by reading the URL on sign-up.
      // ───────────────────────────────────────────────────────────────
      (function () {
        var VARIANTS = {
          A: "editorial.html",  // Editorial Light
          B: "studio.html",     // Studio Dark
          C: "bazaar.html",     // Bazaar
        };
        var STORAGE_KEY = "aiomnipost_variant";
        var QS_KEY = "variant";

        // Allow forcing a variant via ?force=A for QA.
        var params = new URLSearchParams(location.search);
        var forced = (params.get("force") || "").toUpperCase();

        var chosen = forced && VARIANTS[forced]
          ? forced
          : localStorage.getItem(STORAGE_KEY);

        if (!chosen || !VARIANTS[chosen]) {
          var keys = Object.keys(VARIANTS);
          chosen = keys[Math.floor(Math.random() * keys.length)];
          localStorage.setItem(STORAGE_KEY, chosen);
          // Record the first-impression for analytics later.
          try {
            var bucket = JSON.parse(localStorage.getItem("aiomnipost_bucket_log") || "{}");
            bucket[chosen] = (bucket[chosen] || 0) + 1;
            bucket._first_seen = bucket._first_seen || new Date().toISOString();
            localStorage.setItem("aiomnipost_bucket_log", JSON.stringify(bucket));
          } catch (e) {}
        }

        var dest = VARIANTS[chosen] + "?" + QS_KEY + "=" + chosen;
        // small delay so the splash registers; prevents a jarring flash
        setTimeout(function () { location.replace(dest); }, 250);
      })();
    </script>
  </body>
</html>
